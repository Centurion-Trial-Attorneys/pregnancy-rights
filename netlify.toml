# Netlify publishes the prebuilt ./public folder. No build step runs on Netlify;
# the publisher task runs `python3 build.py` and commits the result.
[build]
  publish = "public"
  command = ""

[[redirects]]
  from = "https://www.pregnancyrights.law/*"
  to = "https://pregnancyrights.law/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
